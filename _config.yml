title: Arhan Nagavelli
description: >-
  Junior CS student at Rutgers University, working on computer architecture
  for ML and ML for computer architecture.
url: "https://arhan-14.github.io"
baseurl: ""                          
                                      

permalink: /blog/:year/:month/:day/:title/

collections_dir: .
markdown: kramdown
plugins:
  - jekyll-feed         
  - jekyll-sitemap      
  - jekyll-seo-tag      

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
